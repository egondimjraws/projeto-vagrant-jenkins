name: CI - Build, SAST and DAST

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1 — Setup e validação de sintaxe
  # Substitui o antigo passo "Build" (que não existe neste projeto).
  # ---------------------------------------------------------------
  setup:
    name: Setup and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

  # ---------------------------------------------------------------
  # Job 2 — SAST (Semgrep)
  # ---------------------------------------------------------------
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/javascript
            p/security-audit

  # ---------------------------------------------------------------
  # Job 3 — DAST (OWASP ZAP)
  # ---------------------------------------------------------------
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup
    defaults:
      run:
        working-directory: app

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start application
        env:
          PORT: 3000
          NODE_ENV: production
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid

          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              echo "Application started successfully!"
              exit 0
            fi
            echo "Waiting for the application... ($i/30)"
            sleep 2
          done

          echo "The application did not start correctly."
          cat app.log
          exit 1

      - name: DAST - OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          allow_issue_writing: false
          fail_action: false

      - name: Save application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app/app.log

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi