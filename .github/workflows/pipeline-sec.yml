name: CI - Build, SAST and DAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- Job 1: Build + Testes ----------
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Se não houver script "build", remova este passo
        # ou adicione em app/package.json: "build": "tsc" / "echo ok"

      - name: Test
        run: npm test

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: app
          retention-days: 1

  # ---------- Job 2: SAST ----------
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/javascript
            p/security-audit
          # Analisa somente a pasta do app
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        # Se não usar Semgrep Cloud, remova o token e o generateSarif

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  # ---------- Job 3: DAST ----------
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    defaults:
      run:
        working-directory: app

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start application
        env:
          PORT: 3000
          NODE_ENV: production
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid

          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              echo "Application started successfully!"
              exit 0
            fi
            echo "Waiting for the application... ($i/30)"
            sleep 2
          done

          echo "The application did not start correctly."
          cat app.log
          exit 1

      - name: DAST - OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report

      - name: Save application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app/app.log

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi