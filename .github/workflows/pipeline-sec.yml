name: CI - Build, SAST and DAST

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-pipeline:
    name: Security pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: SAST - static analysis with Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/javascript
            p/security-audit

      - name: Build
        working-directory: app
        run: npm run build

      - name: Test
        working-directory: app
        run: npm test

      - name: Start DAST application
        working-directory: app
        run: |
          nohup npm start > app.log 2>&1 &

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000; then
              echo "Application started successfully!"
              exit 0
            fi

            echo "Waiting for the application..."
            sleep 2
          done

          echo "The application did not start correctly."
          cat app.log
          exit 1

      - name: DAST - dynamic analysis with OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          allow_issue_writing: false
          fail_action: false

      - name: Save application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app/app.log
